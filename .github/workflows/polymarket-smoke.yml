name: Polymarket API smoke

on:
  workflow_dispatch:
  push:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run public API smoke test
        run: python3 polymarket_smoke.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-smoke-results
          path: smoke_results.json
