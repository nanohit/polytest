name: Polymarket maker screen

on:
  workflow_dispatch:
  push:

concurrency:
  group: polymarket-maker-screen
  cancel-in-progress: true

jobs:
  maker-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Public API smoke test
        run: python3 polymarket_smoke.py
      - name: Upload smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-smoke
          path: smoke_results.json
