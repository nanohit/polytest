name: Polymarket maker screen

on:
  workflow_dispatch:
  push:

concurrency:
  group: polymarket-maker-screen
  cancel-in-progress: true

jobs:
  maker-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Public API smoke test
        run: python3 polymarket_smoke.py
      - name: Run cheap CRYPTO leaderboard maker screen
        run: python3 maker_leaderboard_screen.py
      - name: Upload research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-maker-screen
          path: |
            smoke_results.json
            leaderboard_maker_summary.json
            leaderboard_maker_wallets.csv
            leaderboard_maker_errors.json
