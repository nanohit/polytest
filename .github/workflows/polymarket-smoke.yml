name: Polymarket deep maker audit

on:
  workflow_dispatch:

concurrency:
  group: polymarket-maker-screen
  cancel-in-progress: true

jobs:
  maker-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Public API smoke test
        run: python3 polymarket_smoke.py
      - name: Deep empirical audit
        run: python3 deep_empirical_audit.py
      - name: Realized-only D1 audit
        run: python3 realized_d1_audit.py
      - name: Upload research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-deep-audit
          path: |
            smoke_results.json
            deep_empirical_audit.json
            mixed_wallet_days.csv
            realized_d1_audit.json
