name: Polymarket maker screen

on:
  workflow_dispatch:
  push:

concurrency:
  group: polymarket-maker-screen
  cancel-in-progress: true

jobs:
  maker-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Public API smoke test
        run: python3 polymarket_smoke.py
      - name: Run category-consistent maker intensity probe
        run: python3 maker_intensity_probe.py
      - name: Upload research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-maker-screen
          path: |
            smoke_results.json
            maker_intensity_summary.json
            maker_intensity_overall.csv
            maker_intensity_errors.json
