name: Polymarket maker screen

on:
  workflow_dispatch:
  push:

concurrency:
  group: polymarket-maker-screen
  cancel-in-progress: true

jobs:
  maker-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Public API smoke test
        run: python3 polymarket_smoke.py
      - name: Run targeted 60-day 50-maker cohort screen
        run: python3 maker_screen_fast.py
      - name: Upload research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-maker-screen
          path: |
            smoke_results.json
            maker_screen_summary.json
            maker_wallets.csv
            rebate_rows.csv
            maker_screen_errors.json
